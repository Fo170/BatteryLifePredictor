sentence=Prédiction de vie résiduelle des batteries pour Arduino / ESP32 / ARM.
paragraph=Librairie header-only qui calcule la vie résiduelle d'une batterie en combinant plusieurs modèles mathématiques : DOD exponentiel, correction température Arrhenius/Van't Hoff, sulfatation (plomb), comptage EFC, règle de Miner, Rainflow, régression linéaire, Kalman 1D et mode simulation rapide. Compatible avec les librairies BatteryModels et BatteryKalman de Fo170. Supporte 20 technologies de batteries.
category=Other
url=https://github.com/Fo170/BatteryLifePredictor
