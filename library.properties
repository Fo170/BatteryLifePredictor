sentence=Prédiction de vie résiduelle des batteries pour Arduino / ESP32 / ESP8266 / ARM.
paragraph=Librairie header-only qui calcule la vie résiduelle d'une batterie en combinant plusieurs modèles mathématiques : DOD exponentiel, correction température Arrhenius/Van't Hoff, sulfatation (plomb), comptage EFC, règle de Miner, Rainflow, régression linéaire, Kalman 1D et mode simulation rapide. Supporte 20 technologies de batteries. Depuis la v1.5.0 le header inclut explicitement BatteryModels et BatteryKalman (il ne les déclarait qu'en avant).
